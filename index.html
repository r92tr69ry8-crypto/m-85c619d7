<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1d0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
:root{
  --table:#1d0e11; --cream:#f4eadb; --cream2:rgba(244,234,219,.7); --cream3:rgba(244,234,219,.45);
  --paper:#f7eddc; --ink:#2b1d20; --ink2:rgba(43,29,32,.6); --blue:#24386a;
  --wine:#6e1423; --gold:#c9a46a;
  --hand:'Reenie Beanie','Bradley Hand',cursive; --serif:'Cormorant Garamond',Georgia,serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0e0607;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* the table at night */
#app{position:relative;width:100%;max-width:480px;height:100%;height:100dvh;margin:0 auto;overflow:hidden;color:var(--cream);
  background-color:var(--table);
  background-image:radial-gradient(120% 70% at 50% 6%,rgba(255,176,118,.16),rgba(255,176,118,0) 62%),radial-gradient(150% 110% at 50% 55%,rgba(0,0,0,0) 48%,rgba(0,0,0,.55) 100%)}
#glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 45% at 50% 4%,rgba(255,160,96,.13),rgba(255,160,96,0) 70%);animation:flicker 7s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:.85}18%{opacity:1}31%{opacity:.78}47%{opacity:.96}62%{opacity:.82}80%{opacity:1}}
#app::after{content:"";position:absolute;inset:-60px;background-image:var(--grain);opacity:.075;mix-blend-mode:overlay;pointer-events:none;z-index:60;animation:grain 1s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-14px,9px)}40%{transform:translate(11px,-12px)}60%{transform:translate(-8px,-6px)}80%{transform:translate(13px,10px)}}
.paper{background-color:var(--paper);background-image:var(--grain);background-blend-mode:soft-light}

.scr{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1s var(--ease),visibility 0s 1s}
.scr.on{opacity:1;visibility:visible;transition:opacity 1s var(--ease)}
.hand{font-family:var(--hand);font-weight:400}
.wl{clip-path:inset(-12px calc(100% + 14px) -12px -12px);-webkit-clip-path:inset(-12px calc(100% + 14px) -12px -12px)}
.wl.w{clip-path:inset(-12px -12px -12px -12px);-webkit-clip-path:inset(-12px -12px -12px -12px)}
.pill{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:6px 22px 4px;border:1px solid rgba(244,234,219,.38);border-radius:999px;font:400 26px/1 var(--hand);color:var(--cream);transition:transform .2s var(--ease),opacity .6s}
.pill:active{transform:scale(.96)}
.pill svg{width:26px;height:14px;flex:none}

/* lock: an envelope */
#lock{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 16px)}
.env{position:relative;container-type:inline-size;width:min(80vw,310px,46dvh);aspect-ratio:300/190;perspective:900px;border-radius:3px;box-shadow:0 22px 44px rgba(0,0,0,.5),0 3px 8px rgba(0,0,0,.35);transform:rotate(-1.2deg)}
.env>.envbg{position:absolute;inset:0;width:100%;height:100%}
.flapw{position:absolute;left:0;right:0;top:0;height:62%;transform-origin:50% 0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;filter:drop-shadow(0 3px 2px rgba(60,28,18,.28));transition:transform 1s var(--ease) .45s;z-index:2}
.flap{position:absolute;inset:0;background-color:#e9d7b9;background-image:var(--grain);background-blend-mode:soft-light;clip-path:polygon(0 0,100% 0,50% 100%);-webkit-clip-path:polygon(0 0,100% 0,50% 100%)}
.seal{position:absolute;left:50%;top:62%;width:24.5%;height:auto;aspect-ratio:1;margin:-13% 0 0 -12.25%;z-index:3;filter:drop-shadow(0 3px 4px rgba(40,6,10,.45))}
.envname{position:absolute;left:0;right:0;bottom:7%;text-align:center;font:400 30px/1 var(--hand);font-size:9.7cqw;color:var(--ink);z-index:1;transform:rotate(-2deg)}
#lockHint{margin-top:clamp(12px,3.6dvh,30px);font:400 25px/1 var(--hand);color:var(--cream2);min-height:26px;text-align:center}
#slots{display:flex;gap:16px;margin:clamp(6px,2dvh,16px) 0 clamp(10px,2.2dvh,18px)}
.slot{width:34px;height:44px;border-bottom:1.5px solid rgba(244,234,219,.4);display:flex;align-items:flex-end;justify-content:center;font:400 38px/1 var(--hand);color:var(--cream);transition:border-color .3s}
.slot b{font-weight:400;transform:translateY(4px)}
.slot.f{border-color:var(--gold)}
#slots.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#pad{--kb:clamp(50px,8.6dvh,64px);display:grid;grid-template-columns:repeat(3,var(--kb));gap:clamp(6px,1.3dvh,10px) 30px}
#pad button{width:var(--kb);height:var(--kb);border-radius:50%;border:1px solid rgba(201,164,106,.32);font:500 30px/1 var(--serif);font-variant-numeric:lining-nums;color:var(--cream);transition:background .15s}
#pad button:active{background:rgba(201,164,106,.22)}
#pad .x{border:none;font:italic 400 18px var(--serif);color:var(--cream2)}
#lock.opening .seal{animation:sealPop .8s var(--ease) forwards}
#lock.opening .flapw{transform:rotateX(178deg)}
#lock.opening .env{animation:envAway 1.2s var(--ease) 1.3s forwards}
#lock.opening #pad,#lock.opening #lockHint{opacity:0;transition:opacity .6s}
#lock.opening .slot{border-color:var(--gold)}
@keyframes sealPop{0%{transform:none}35%{transform:scale(1.14) rotate(-8deg)}100%{transform:translateY(46px) scale(.7) rotate(24deg);opacity:0}}
@keyframes envAway{to{transform:translateY(36px) rotate(-1.2deg);opacity:0}}

/* letter */
#letter{padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 16px)}
.sheet{--lf:28px;position:relative;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:34px 26px 22px 28px;box-shadow:0 24px 50px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);transform:translateY(70px) rotate(-.8deg);opacity:0;transition:transform 1.3s var(--ease) .2s,opacity 1s .2s;display:flex;flex-direction:column;color:var(--ink)}
#letter.on .sheet{transform:rotate(-.8deg);opacity:1}
.sheet::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 33.2%,rgba(80,50,30,.045) 33.3%,rgba(255,255,255,.3) 33.6%,transparent 34%,transparent 66.4%,rgba(80,50,30,.045) 66.5%,rgba(255,255,255,.3) 66.8%,transparent 67.2%)}
#lines{font:400 var(--lf)/1.22 var(--hand)}
#lines div{min-height:.6em}
#sign{font:400 calc(var(--lf) * 1.4)/1 var(--hand);margin-top:calc(var(--lf) * .4);align-self:flex-end;transform:rotate(-4deg);opacity:0;transition:opacity 1s}
#sign.in{opacity:1}
#ps{font:400 calc(var(--lf) * .86)/1 var(--hand);color:var(--wine);margin-top:calc(var(--lf) * .3);opacity:0;transition:opacity 1s}
#ps.in{opacity:1}
#toStory{margin-top:auto;flex:none;align-self:flex-start;color:var(--ink);border-color:rgba(43,29,32,.3);opacity:0;pointer-events:none}
#toStory.in{opacity:1;pointer-events:auto}

/* story */
#story{touch-action:none}
#bars{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;gap:4px;z-index:20}
#bars b{flex:1;height:2px;border-radius:2px;background:rgba(244,234,219,.22);overflow:hidden}
#bars b i{display:block;height:100%;width:0;background:var(--cream)}
#chap{position:absolute;top:calc(env(safe-area-inset-top) + 22px);left:14px;z-index:20;font:500 12px var(--serif);letter-spacing:.2em;text-transform:uppercase;color:var(--cream3)}
#table{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 54px);bottom:calc(env(safe-area-inset-bottom) + 30px)}
#tip{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 8px);text-align:center;font:italic 400 15px var(--serif);color:var(--cream3);opacity:0;transition:opacity .8s;z-index:20;pointer-events:none}
#tip.in{opacity:1}
#spin{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border:2px solid rgba(244,234,219,.15);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;display:none;z-index:30}
@keyframes sp{to{transform:rotate(360deg)}}

.obj{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(var(--s,1));transition:transform .8s var(--ease),filter .8s var(--ease)}
.obj.enter{animation:place .9s var(--ease)}
@keyframes place{from{opacity:0;transform:translate(-50%,calc(-50% - 40px)) rotate(calc(var(--r,0deg) * 3)) scale(calc(var(--s,1) * 1.06))}to{opacity:1;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(var(--s,1))}}
.obj.under{transform:translate(calc(-50% + var(--ux,0px)),calc(-50% + var(--uy,0px))) rotate(var(--ur,0deg)) scale(calc(var(--s,1) * .95));filter:brightness(.5)}

.tape{position:absolute;left:50%;top:-15px;width:96px;height:30px;margin-left:-48px;transform:rotate(var(--tr,0deg));z-index:3;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 6px,rgba(255,255,255,0) 6px 12px),rgba(226,168,164,.72);
  clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,100% 0,96% 12%,100% 22%,96% 34%,100% 46%,96% 58%,100% 70%,96% 82%,100% 92%,96% 100%,0 100%,4% 90%,0 78%,4% 66%,0 54%,4% 42%,0 30%,4% 18%);
  box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tape.k{background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 5px,rgba(255,255,255,0) 5px 10px),rgba(208,180,136,.78)}

.pol{padding:12px 12px 0;box-shadow:0 18px 36px rgba(0,0,0,.5),0 2px 5px rgba(0,0,0,.35)}
.pol .ph{position:relative;overflow:hidden;background:#d8cdbb}
.pol .ph::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 40px rgba(40,20,10,.22);pointer-events:none}
.pol .m{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.04) contrast(1.04) sepia(.07);opacity:0;transition:opacity .6s}
.pol .m.in{opacity:1}
.strip{position:relative;padding:12px 6px 16px;min-height:62px;color:var(--ink);font:400 23px/1.08 var(--hand)}
.strip .cap{display:block;padding-right:34px;text-wrap:pretty}
.strip .dt{position:absolute;right:4px;bottom:9px;font-size:18px;color:var(--ink2);transform:rotate(-3deg)}

.phone-o{width:min(84vw,318px)}
.phone-o .above{font:400 27px/1 var(--hand);color:var(--cream2);text-align:center;margin-bottom:14px;transform:rotate(-1.5deg)}
.phone{position:relative;background:#0c0c0f;border-radius:30px;padding:28px 12px 16px;box-shadow:0 20px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07) inset}
.phone .tape{top:-13px}
.ptime{text-align:center;font:500 11px -apple-system,system-ui,sans-serif;color:#8a8a90;margin:2px 0 10px}
.msgs{display:flex;flex-direction:column;gap:5px}
.msg{position:relative;max-width:82%;padding:7px 12px;border-radius:18px;font:400 13.5px/1.28 -apple-system,system-ui,sans-serif;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
.msg.in{opacity:1;transform:none}
.msg.her{align-self:flex-start;background:#26262b;color:#f1f1f1;margin-left:26px}
.msg.her.av::before{content:"E";position:absolute;left:-26px;bottom:0;width:20px;height:20px;border-radius:50%;background:#7a1c29;color:#f4eadb;font:600 10px/20px -apple-system,system-ui,sans-serif;text-align:center}
.msg.me{align-self:flex-end;background:#7a3ce0;color:#fff}
.msg.reel{padding:0;overflow:hidden;width:136px;height:136px;background:#26262b}
.msg.reel img{display:block;width:136px;height:136px;object-fit:cover}
.dots{display:none;position:absolute;left:13px;top:50%;transform:translateY(-50%);gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:#8a8a90;animation:ty 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,60%,100%{opacity:.3}30%{opacity:1}}
.msg.typing .tx,.msg.typing img{visibility:hidden}
.msg.typing .dots{display:flex}
.phone-o .below{font:400 25px/1.1 var(--hand);color:var(--cream);text-align:center;margin-top:16px;padding:0 6px;transform:rotate(-1deg)}

.note{width:min(88vw,342px);padding:46px 18px 30px 46px;color:var(--blue);font:400 26px/34px var(--hand);box-shadow:0 18px 36px rgba(0,0,0,.5),0 2px 5px rgba(0,0,0,.3);
  background-color:#fbf8f1;
  background-image:linear-gradient(90deg,transparent 36px,rgba(214,96,96,.38) 36px,rgba(214,96,96,.38) 37.5px,transparent 37.5px),repeating-linear-gradient(to bottom,transparent 0,transparent 33px,rgba(90,120,180,.24) 33px,rgba(90,120,180,.24) 34px),var(--grain);
  background-position:0 0,0 46px,0 0;background-blend-mode:normal,normal,soft-light}
.note .tape{top:-6px}

.cover{width:min(86vw,340px);text-align:center}
.cover .lab{font:500 12px var(--serif);letter-spacing:.24em;text-transform:uppercase;color:var(--cream3);margin-bottom:10px}
.cover .ttl{font:400 clamp(58px,19vw,78px)/.95 var(--hand);color:var(--cream)}
.cover svg{display:block;width:170px;height:22px;margin:4px auto 6px;overflow:visible}
.cover svg path{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:0;animation:draw 1.6s var(--ease)}
@keyframes draw{0%,25%{stroke-dashoffset:240}100%{stroke-dashoffset:0}}
.cover .sub{font:400 30px/1 var(--hand);color:var(--cream2)}

/* heart */
#heartScr{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px)}
#hIntro{font:400 34px/1 var(--hand);color:var(--cream2);margin-bottom:26px;transform:rotate(-2deg)}
#heart{position:relative;width:min(80vw,300px);aspect-ratio:300/270}
#heart>svg,#heart canvas{position:absolute;inset:0;width:100%;height:100%}
#heart canvas{touch-action:none;transition:opacity 1.4s var(--ease)}
.phrase{position:absolute;left:0;right:0;top:31%;text-align:center;font:500 clamp(26px,8.6vw,32px)/1.12 var(--serif);color:var(--wine)}
#heart.beat{animation:beat 1.25s ease-in-out infinite}
@keyframes beat{0%{transform:scale(1)}14%{transform:scale(1.06)}28%{transform:scale(1)}42%{transform:scale(1.04)}70%{transform:scale(1)}}
#hSub{font:400 27px/1.1 var(--hand);color:var(--cream2);margin-top:26px;min-height:30px;text-align:center;opacity:0;transition:opacity 1.2s}
#hSub.in{opacity:1}
#toCard{margin-top:22px;opacity:0;pointer-events:none}
#toCard.in{opacity:1;pointer-events:auto}

/* postcard */
#cardScr{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 20px)}
.pc{width:min(90vw,370px);aspect-ratio:3/2;perspective:1400px;container-type:inline-size;cursor:pointer;transform:translateY(40px) rotate(4deg);opacity:0;transition:transform 1.4s var(--ease) .3s,opacity 1s .3s}
#cardScr.on .pc{transform:rotate(-2deg);opacity:1}
.pc-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform 1.1s var(--ease)}
.pc.flip .pc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 22px 44px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);overflow:hidden}
.front{padding:7px;background:#f7f2e8}
.front svg{display:block;width:100%;height:100%}
.ftext{position:absolute;left:7%;top:8%;font:400 44px/0.9 var(--hand);font:400 13cqw/0.9 var(--hand);color:#fffaf1;text-shadow:0 1px 8px rgba(120,40,40,.35);transform:rotate(-4deg)}
.back{transform:rotateY(180deg);display:grid;grid-template-columns:1.75fr 1fr;padding:18px 15px 15px;padding:5cqw 4.2cqw 4.2cqw;color:var(--ink)}
.back .msg2{font:400 18px/1.04 var(--hand);font:400 5.25cqw/1.03 var(--hand);padding-right:3cqw;border-right:1px solid rgba(43,29,32,.25)}
.back .msg2 .ps{margin-top:1.8cqw;color:var(--wine)}
.back .rt{position:relative;padding-left:4cqw}
.stamp{position:absolute;right:0;top:0;width:52px;height:62px;padding:5px;width:15cqw;height:18cqw;padding:1.4cqw;transform:rotate(3deg);
  background:radial-gradient(circle at 50% 50%,transparent 1.2px,#fbf6ec 1.6px) -2.5px -2.5px/5px 5px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.stamp svg{width:100%;height:100%;display:block}
.pmark{position:absolute;right:32px;top:20px;width:70px;height:70px;right:9cqw;top:6cqw;width:20cqw;height:20cqw;transform:rotate(-12deg);opacity:.62}
.addr{position:absolute;left:3.6cqw;right:0;bottom:1cqw;font:400 17px/1 var(--hand);font:400 4.9cqw/1 var(--hand)}
.addr div{border-bottom:1px solid rgba(43,29,32,.28);padding:1.8cqw 0 .5cqw}
#pcHint{margin-top:24px;font:400 27px/1 var(--hand);color:var(--cream);display:flex;align-items:center;gap:10px;transition:opacity .6s}
#pcHint svg{width:30px;height:34px;flex:none}
.tapme{position:absolute;right:13%;bottom:16%;width:56px;height:56px;margin:-28px;z-index:5;pointer-events:none}
.tapme i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,250,240,.95);box-shadow:0 0 12px rgba(255,220,180,.6);animation:ripple 1.8s ease-out infinite}
.tapme i:nth-child(2){animation-delay:.6s}
.tapme b{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:rgba(255,250,240,.95);box-shadow:0 0 10px rgba(255,220,180,.8)}
@keyframes ripple{0%{transform:scale(.35);opacity:1}100%{transform:scale(1.5);opacity:0}}
.pc.flip .tapme,.pc.seen .tapme{display:none}
.pc.nudge .pc-in{animation:nudge 3.4s ease-in-out 1.6s infinite}
@keyframes nudge{0%,64%,100%{transform:rotateY(0)}74%{transform:rotateY(24deg)}84%{transform:rotateY(-7deg)}91%{transform:rotateY(3deg)}}
.end{margin-top:22px;text-align:center;opacity:0;transform:translateY(10px);transition:opacity 1.2s,transform 1.2s var(--ease);pointer-events:none}
.end.in{opacity:1;transform:none;pointer-events:auto}
#endT{font:400 40px/1 var(--hand);color:var(--cream)}
#endS{font:400 26px/1.1 var(--hand);color:var(--cream2);margin-top:8px}
#again{margin-top:22px;font-size:23px;min-height:44px}

#mute{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:8px;width:44px;height:44px;z-index:70;display:none;align-items:center;justify-content:center;color:var(--cream2)}
#mute.on{display:flex}
#mute svg{width:22px;height:22px}
#broken{display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;font:400 30px/1.15 var(--hand);color:var(--cream2)}
@media (prefers-reduced-motion:reduce){#app::after,#glow,#heart.beat{animation:none}.obj.enter{animation-duration:.4s}}
</style>
</head>
<body>
<div id="app">
  <div id="glow"></div>

  <section id="broken" class="scr"><p>This link is missing a piece.<br>Scan the QR code again.</p></section>

  <section id="lock" class="scr">
    <div class="env paper">
      <svg class="envbg" viewBox="0 0 300 190" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 0 L150 104 L0 190 Z" fill="#ecdcc0"/>
        <path d="M300 0 L150 104 L300 190 Z" fill="#ecdcc0"/>
        <path d="M0 190 L150 92 L300 190 Z" fill="#f4e8d2" stroke="rgba(70,40,30,.12)" stroke-width=".8"/>
      </svg>

              <text x="50" y="57" font-family="Cormorant Garamond,Georgia,serif" font-size="13" font-weight="500" letter-spacing="1.5" text-anchor="middle" fill="#2b1d20" id="pm2"></text>
              <path d="M-40 40 q 8 -5 16 0 t 16 0 t 16 0 M-40 52 q 8 -5 16 0 t 16 0 t 16 0 M-40 64 q 8 -5 16 0 t 16 0 t 16 0" fill="none" stroke="#2b1d20" stroke-width="1.6"/>

<script>
(() => {
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = i => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const ARROW = '<svg viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 8 C 8 5, 15 9, 22 6"/><path d="M17 2 L23 6 L18 11"/></svg>';
const HEART = 'M150 258 C 62 196 12 146 12 88 C 12 42 46 12 88 12 C 116 12 138 28 150 52 C 162 28 184 12 212 12 C 254 12 288 42 288 88 C 288 146 238 196 150 258 Z';

let key, M, flat = [], song = null, songWanted = false;
const pending = {};

function show(id){ document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); }
function b64url(s){ s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function dec(buf){ return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12)); }
function asset(name, type){
  if (!pending[name]) pending[name] = fetch('a/' + name).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(dec).then(b => URL.createObjectURL(new Blob([b], { type })));
  return pending[name];
}

async function boot(){
  const k = new URLSearchParams(location.hash.slice(1)).get('k');
  if (!k || !window.crypto || !crypto.subtle) return show('broken');
  try {
    key = await crypto.subtle.importKey('raw', b64url(k), 'AES-GCM', false, ['decrypt']);
    const r = await fetch('m.bin', { cache: 'no-store' });
    M = JSON.parse(new TextDecoder().decode(await dec(await r.arrayBuffer())));
  } catch (e) { return show('broken'); }
  document.title = 'for ' + M.name;
  M.chapters.forEach((c, ci) => c.slides.forEach(s => flat.push(Object.assign({ ci }, s))));
  fillTexts();
  show('lock');
  preload();
}

function fillTexts(){
  $('#envName').textContent = M.lock.envelope;
  $('#lockHint').textContent = M.lock.hint;
  $('#seal').innerHTML = sealSVG();
  $('#toStory').innerHTML = esc(M.letter.next) + ARROW;
  $('#sign').textContent = M.letter.sign;
  $('#ps').textContent = M.letter.ps || '';
  $('#hIntro').textContent = M.heart.intro;
  $('#phrase').innerHTML = M.heart.phrase.map(esc).join('<br>');
  $('#hSub').textContent = M.heart.after;
  $('#toCard').innerHTML = esc(M.heart.next) + ARROW;
  $('#hbase').setAttribute('d', HEART);
  $('#fText').textContent = M.postcard.front;
  $('#pcMsg').innerHTML = M.postcard.msg.map(l => `<div>${esc(l)}</div>`).join('') + `<div class="ps">${M.postcard.ps.map(esc).join('<br>')}</div>`;
  $('#pcTo').innerHTML = M.postcard.to.map(l => `<div>${esc(l)}</div>`).join('');
  $('#pm1').textContent = M.postcard.mark[0];
  $('#pm2').textContent = M.postcard.mark[1];
  $('#pcHintT').textContent = M.postcard.hint;
  $('#endT').textContent = M.ending.title;
  $('#endS').textContent = M.ending.sub;
  $('#again').textContent = M.ending.again;
  $('#tip').textContent = M.ui.tip;
}

function sealSVG(){
  let d = '', n = 22;
  const pts = [...Array(n)].map((_, i) => { const a = i / n * Math.PI * 2; const r = 44 + Math.sin(i * 2.7) * 2.6 + Math.cos(i * 1.3) * 1.8; return [50 + r * Math.cos(a), 50 + r * Math.sin(a)]; });
  pts.forEach((p, i) => { const q = pts[(i + 1) % n]; const m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; d += (i ? ' Q' : 'M' + ((pts[n-1][0] + p[0]) / 2).toFixed(1) + ' ' + ((pts[n-1][1] + p[1]) / 2).toFixed(1) + ' Q') + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ' ' + m[0].toFixed(1) + ' ' + m[1].toFixed(1); });
  return `<defs><radialGradient id="wx" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#a8363f"/><stop offset=".55" stop-color="#7a1c29"/><stop offset="1" stop-color="#4c0d16"/></radialGradient></defs>
    <path d="${d} Z" fill="url(#wx)"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="#4f0f18" stroke-width="3.2" opacity=".75"/>
    <circle cx="50" cy="50" r="27.5" fill="none" stroke="#c46a72" stroke-width="1" opacity=".35"/>
    <path d="M50 64 C 38 56 33 50 33 44 C 33 39 37 36 41.5 36 C 45 36 48 38 50 41 C 52 38 55 36 58.5 36 C 63 36 67 39 67 44 C 67 50 62 56 50 64 Z" fill="#5e1320" stroke="#b9545e" stroke-width="1" stroke-opacity=".45"/>
    <path d="M30 30 Q 38 22 50 21" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2.4" stroke-linecap="round"/>`;
}

// song first, then the story in order, 3 at a time
function preload(){
  const q = [[M.chat.reel, 'image/jpeg']];
  if (M.song) q.unshift([M.song, 'audio/mp4']);
  flat.forEach(s => { if (s.poster) q.push([s.poster, 'image/jpeg']); if (s.file) q.push([s.file, s.kind === 'vid' ? 'video/mp4' : 'image/jpeg']); });
  if (M.song) asset(M.song, 'audio/mp4').then(u => { song = new Audio(); song.loop = true; song.preload = 'auto'; song.setAttribute('playsinline', ''); song.src = u; });
  let i = 0;
  const worker = () => i < q.length ? asset(...q[i++]).catch(() => {}).then(worker) : null;
  worker(); worker(); worker();
}
function playSong(){ return song ? song.play().then(() => { $('#mute').classList.add('on'); setMute(); return true; }).catch(() => false) : Promise.resolve(false); }
let armed = false;
function armSong(){
  if (armed) return; armed = true;
  const evs = ['pointerup', 'click', 'touchend'];
  const h = () => { if (!song || !song.paused) return; playSong().then(ok => { if (ok) evs.forEach(ev => document.removeEventListener(ev, h, true)); }); };
  evs.forEach(ev => document.addEventListener(ev, h, true));
}
function setMute(){
  $('#mute').innerHTML = song && song.muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';
}
$('#mute').addEventListener('click', e => { e.stopPropagation(); if (!song) return; song.muted = !song.muted; setMute(); });
$('#mute').addEventListener('pointerdown', e => e.stopPropagation());

// ---------- lock ----------
let typed = '', wrong = 0, unlocked = false;
const slots = [...document.querySelectorAll('.slot')];
$('#pad').addEventListener('pointerdown', e => {
  const b = e.target.closest('button'); if (!b || unlocked) return;
  e.preventDefault();
  navigator.vibrate && navigator.vibrate(8);
  if (b.hasAttribute('data-x')) typed = typed.slice(0, -1);
  else if (typed.length < 4) typed += b.dataset.d;
  slots.forEach((s, i) => { s.querySelector('b').textContent = typed[i] || ''; s.classList.toggle('f', i < typed.length); });
  if (typed.length === 4) { if (typed === M.code) unlock(); else setTimeout(fail, 280); }
});
function fail(){
  wrong++; typed = '';
  const s = $('#slots'); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake');
  slots.forEach(x => { x.querySelector('b').textContent = ''; x.classList.remove('f'); });
  $('#lockHint').textContent = wrong < 3 ? M.lock.wrong1 : M.lock.wrong2;
}
function unlock(){
  unlocked = true; songWanted = true;
  armSong();
  if (song) playSong();
  navigator.vibrate && navigator.vibrate([12, 40, 12]);
  $('#lock').classList.add('opening');
  setTimeout(() => { show('letter'); writeLetter(); }, 2300);
}

// ---------- letter ----------
let T = {};
function tokens(){
  const now = Date.now(), t0 = new Date(M.together).getTime(), s0 = new Date(M.started).getTime();
  let sec = Math.max(0, Math.floor((now - t0) / 1000));
  const d = Math.floor(sec / 86400); sec -= d * 86400;
  const h = Math.floor(sec / 3600); sec -= h * 3600;
  const m = Math.floor(sec / 60);
  const pl = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  T = { days: pl(d, 'day'), hours: pl(h, 'hour'), minutes: pl(m, 'minute'), since: pl(Math.floor((now - s0) / 864e5), 'day'),
        first: d <= 35 ? M.letter.first_now : M.letter.first_later };
}
const fill = str => esc(str).replace(/\{(\w+)\}/g, (_, k) => `<span data-t="${k}">${esc(T[k] || '')}</span>`);
async function writeLines(els, speed){
  for (const el of els) {
    const n = el.textContent.length;
    if (!n) { el.classList.add('w'); await sleep(260); continue; }
    const d = Math.max(420, n * speed);
    el.style.transition = `clip-path ${d}ms linear, -webkit-clip-path ${d}ms linear`;
    void el.offsetWidth; el.classList.add('w');
    await sleep(d + 160);
  }
}
function fitLetter(){
  const sh = $('.sheet'); if (!sh) return;
  let fs = Math.min(29, Math.max(22, window.innerWidth * 0.072));
  sh.style.setProperty('--lf', fs + 'px');
  while (sh.scrollHeight > sh.clientHeight + 1 && fs > 15) { fs -= 0.5; sh.style.setProperty('--lf', fs + 'px'); }
}
window.addEventListener('resize', () => { if ($('#letter').classList.contains('on')) fitLetter(); });
async function writeLetter(){
  tokens();
  const box = $('#lines');
  box.innerHTML = M.letter.lines.map(l => `<div class="wl">${fill(l)}</div>`).join('');
  try { await document.fonts.ready; } catch (e) {}
  fitLetter();
  setInterval(() => { tokens(); document.querySelectorAll('[data-t]').forEach(s => s.textContent = T[s.dataset.t]); }, 15000);
  await sleep(1300);
  await writeLines([...box.children], 40);
  await sleep(300); $('#sign').classList.add('in');
  await sleep(1100); $('#ps').classList.add('in');
  await sleep(900); $('#toStory').classList.add('in');
}
$('#toStory').addEventListener('click', () => { show('story'); go(0); tipOnce(); });
function tipOnce(){ const t = $('#tip'); setTimeout(() => t.classList.add('in'), 1400); setTimeout(() => t.classList.remove('in'), 6000); }

// ---------- story ----------
let cur = 0, elapsed = 0, dur = 5000, paused = false, ready = false, last = 0, vid = null, timers = [], raf = 0, pile = [];
const table = $('#table'), bars = $('#bars');

function go(i, dir = 1){
  cur = i; elapsed = 0; ready = false; vid = null;
  timers.forEach(clearTimeout); timers = [];
  const s = flat[i];
  if (dir < 0 || s.kind === 'cover' || i === 0) { table.innerHTML = ''; pile = []; }
  pile.forEach(o => {
    o.classList.remove('enter'); o.classList.add('under');
    const v = o.querySelector('video'); if (v) v.pause();
  });
  while (pile.length > 2) pile.shift().remove();
  const inCh = flat.filter(x => x.ci === s.ci), pos = inCh.indexOf(s);
  bars.innerHTML = inCh.map((_, j) => `<b><i style="width:${j < pos ? 100 : 0}%"></i></b>`).join('');
  $('#chap').textContent = M.chapters[s.ci].title;
  $('#spin').style.display = 'none';
  const o = build(s, i);
  o.addEventListener('animationend', e => { if (e.target === o) o.classList.remove('enter'); });
  pile.push(o);
  [i + 1, i + 2].forEach(j => { const n = flat[j]; if (n && n.file) asset(n.file, n.kind === 'vid' ? 'video/mp4' : 'image/jpeg'); });
  last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
}

function obj(cls, i, r){
  r = parseFloat(r) || 0;
  const o = document.createElement('div');
  o.className = 'obj enter ' + cls;
  o.style.setProperty('--r', r + 'deg');
  o.style.setProperty('--ux', ((rnd(i + 3) - .5) * 44).toFixed(1) + 'px');
  o.style.setProperty('--uy', ((rnd(i + 5) - .5) * 30).toFixed(1) + 'px');
  o.style.setProperty('--ur', (r + (rnd(i + 7) - .5) * 9).toFixed(2) + 'deg');
  table.appendChild(o);
  return o;
}
const tape = (i, top) => `<i class="tape ${rnd(i + 11) > .5 ? 'k' : ''}" style="--tr:${((rnd(i + 1) - .5) * 10).toFixed(1)}deg${top ? ';top:' + top : ''}"></i>`;

function build(s, i){
  if (s.kind === 'cover') {
    const o = obj('cover', i, 0);
    o.innerHTML = `<div class="lab">${esc(s.label)}</div><div class="ttl">${esc(s.title)}</div><svg viewBox="0 0 170 22"><path d="M4 15 C 46 5, 104 3, 166 11"/></svg><div class="sub wl">${esc(s.sub)}</div>`;
    dur = 4200; ready = true;
    timers.push(setTimeout(() => writeLines([o.querySelector('.sub')], 55), 1300));
    return o;
  }
  if (s.kind === 'note') {
    const o = obj('note', i, ((rnd(i) - .5) * 3.2).toFixed(2));
    const lines = s.text.split('\n');
    o.innerHTML = tape(i) + lines.map(l => `<div class="wl">${esc(l)}</div>`).join('');
    o.style.clipPath = torn(i);
    fitScale(o);
    const chars = s.text.length;
    dur = 2600 + chars * 62 + lines.length * 180; ready = true;
    timers.push(setTimeout(() => writeLines([...o.querySelectorAll('.wl')], 50), 700));
    return o;
  }
  if (s.kind === 'chat') return buildChat(s, i);

  // polaroid
  const r = ((rnd(i) - .5) * 6).toFixed(2);
  const o = obj('pol paper', i, r);
  o.innerHTML = tape(i) + `<div class="ph"></div><div class="strip"><span class="cap wl">${esc(s.cap)}</span>${s.date ? `<span class="dt">${esc(s.date)}</span>` : ''}</div>`;
  fitPolaroid(o, s);
  const ph = o.querySelector('.ph');
  const writeCap = () => timers.push(setTimeout(() => writeLines([o.querySelector('.cap')], 38), 650));
  if (s.kind === 'img') {
    dur = 5600 + s.cap.length * 30;
    waitFor(s.file, 'image/jpeg', u => {
      const im = new Image(); im.className = 'm'; im.alt = ''; im.src = u;
      im.onload = () => im.classList.add('in');
      ph.appendChild(im); ready = true; writeCap();
    });
  } else {
    const short = s.dur < 5.5;
    dur = short ? 6000 : s.dur * 1000;
    waitFor(s.file, 'video/mp4', u => {
      const v = document.createElement('video');
      v.className = 'm'; v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.autoplay = true; v.loop = short; v.src = u;
      v.addEventListener('playing', () => v.classList.add('in'), { once: true });
      if (!short) v.addEventListener('ended', () => { if (flat[cur] === s) next(); });
      ph.appendChild(v); if (!short) vid = v;
      v.play().catch(() => {}); ready = true; writeCap();
    });
  }
  return o;
}

function fitPolaroid(o, s){
  const tb = table.getBoundingClientRect(), pad = 12;
  const a = Math.min(1.5, Math.max(.62, s.w / s.h));
  const ph = o.querySelector('.ph'), strip = o.querySelector('.strip');
  let W = Math.min(tb.width - 46, 336);
  for (let k = 0; k < 3; k++) {
    o.style.width = W + 'px';
    const maxH = tb.height - 22 - pad - strip.offsetHeight;
    let ih = (W - 2 * pad) / a;
    if (ih <= maxH) { ph.style.height = ih + 'px'; return; }
    ih = maxH; W = ih * a + 2 * pad; ph.style.height = ih + 'px';
  }
}
function fitScale(o){
  const tb = table.getBoundingClientRect();
  const s = Math.min(1, (tb.height - 18) / o.offsetHeight, (tb.width - 20) / o.offsetWidth);
  o.style.setProperty('--s', s.toFixed(3));
}
function torn(i){
  const p = []; const n = 26;
  for (let k = 0; k <= n; k++) p.push(`${(k / n * 100).toFixed(1)}% ${(rnd(i * 31 + k) * 9).toFixed(1)}px`);
  return `polygon(${p.join(',')},100% 100%,0 100%)`;
}

function buildChat(s, i){
  const o = obj('phone-o', i, -1);
  const msgs = M.chat.msgs;
  o.innerHTML = `<div class="above wl">${esc(M.chat.above)}</div><div class="phone">${tape(i)}<div class="ptime">${esc(M.chat.time)}</div><div class="msgs">${
    msgs.map(([who, txt], k) => {
      const av = who === 'her' && (!msgs[k + 1] || msgs[k + 1][0] !== 'her') ? ' av' : '';
      const body = txt === 'reel' ? '<img alt="">' : `<span class="tx">${esc(txt)}</span>`;
      return `<div class="msg ${who}${av}${txt === 'reel' ? ' reel' : ''}">${body}<span class="dots"><i></i><i></i><i></i></span></div>`;
    }).join('')
  }</div></div><div class="below wl">${esc(s.cap)}</div>`;
  fitScale(o);
  dur = 1e9; ready = true;
  asset(M.chat.reel, 'image/jpeg').then(u => { const im = o.querySelector('.reel img'); if (im) im.src = u; });
  const els = [...o.querySelectorAll('.msg')];
  let t = 600;
  timers.push(setTimeout(() => writeLines([o.querySelector('.above')], 45), 300));
  t += 900;
  msgs.forEach(([who], k) => {
    const el = els[k];
    if (who === 'her') {
      timers.push(setTimeout(() => el.classList.add('in', 'typing'), t));
      t += 1050;
      timers.push(setTimeout(() => el.classList.remove('typing'), t));
    } else {
      t += 1150;
      timers.push(setTimeout(() => el.classList.add('in'), t));
    }
    t += 250;
  });
  timers.push(setTimeout(() => writeLines([o.querySelector('.below')], 40), t + 500));
  dur = t + 500 + s.cap.length * 40 + 3600; elapsed = 0;
  return o;
}

function waitFor(name, type, cb){
  const idx = cur; let done = false;
  setTimeout(() => { if (!done && idx === cur) $('#spin').style.display = 'block'; }, 300);
  asset(name, type).then(u => { done = true; if (idx !== cur) return; $('#spin').style.display = 'none'; cb(u); })
    .catch(() => { done = true; if (idx === cur) next(); });
}
function loop(t){
  const dt = t - last; last = t;
  if (ready && !paused) {
    let p;
    if (vid && vid.duration) p = vid.currentTime / vid.duration;
    else { elapsed += dt; p = elapsed / dur; }
    const b = bars.querySelectorAll('b i')[flat.filter(x => x.ci === flat[cur].ci).indexOf(flat[cur])];
    if (b) b.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1 && !vid) return next();
  }
  raf = requestAnimationFrame(loop);
}
function next(){ cancelAnimationFrame(raf); if (cur + 1 < flat.length) go(cur + 1); else toHeart(); }
function prev(){ go(Math.max(0, cur - 1), -1); }

let downAt = 0, downX = 0;
const story = $('#story');
story.addEventListener('pointerdown', e => { downAt = performance.now(); downX = e.clientX; paused = true; if (vid) vid.pause(); });
story.addEventListener('pointerup', () => {
  const held = performance.now() - downAt; paused = false;
  if (held < 260) { const r = story.getBoundingClientRect(); (downX - r.left < r.width / 3) ? prev() : next(); }
  else if (vid) vid.play().catch(() => {});
});
story.addEventListener('pointercancel', () => { paused = false; if (vid) vid.play().catch(() => {}); });

// ---------- heart ----------
async function toHeart(){
  if (vid) vid.pause();
  table.querySelectorAll('video').forEach(v => v.pause());
  show('heartScr');
  try { await document.fonts.load('34px "Reenie Beanie"'); } catch (e) {}
  initScratch();
}
function initScratch(){
  const cv = $('#cv'), box = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(box.width * dpr); cv.height = Math.round(box.height * dpr);
  const x = cv.getContext('2d'), k = box.width / 300 * dpr;
  x.setTransform(k, 0, 0, k, 0, 0);
  const hp = new Path2D(HEART);
  x.save(); x.clip(hp);
  const g = x.createLinearGradient(0, 0, 300, 270);
  g.addColorStop(0, '#a98450'); g.addColorStop(.38, '#e6cd96'); g.addColorStop(.5, '#f3e2b4'); g.addColorStop(.62, '#d9b97f'); g.addColorStop(1, '#9c7845');
  x.fillStyle = g; x.fillRect(0, 0, 300, 270);
  for (let n = 0; n < 1400; n++) { x.fillStyle = `rgba(${rnd(n) > .5 ? '255,250,235' : '90,60,25'},${(.05 + rnd(n + 9) * .12).toFixed(2)})`; x.fillRect(rnd(n + 1) * 300, rnd(n + 2) * 270, 1.2, 1.2); }
  x.fillStyle = 'rgba(105,70,28,.55)'; x.font = '400 40px "Reenie Beanie", cursive'; x.textAlign = 'center';
  x.fillText(M.heart.hint, 150, 128);
  x.restore();
  x.strokeStyle = 'rgba(120,85,40,.6)'; x.lineWidth = 1.5; x.stroke(hp);
  const total = count(x, cv);
  x.globalCompositeOperation = 'destination-out';
  let down = false, n = 0, done = false, lp = null;
  const pt = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) / b.width * 300, (e.clientY - b.top) / b.height * 270]; };
  const draw = p => {
    x.lineWidth = 42; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath(); x.moveTo(...(lp || p)); x.lineTo(...p); x.stroke(); lp = p;
    if (++n % 10 === 0 && !done && 1 - count(x, cv) / total > .55) reveal();
  };
  const reveal = () => {
    done = true; cv.style.opacity = 0; cv.style.pointerEvents = 'none';
    navigator.vibrate && navigator.vibrate([70, 110, 50]);
    setTimeout(() => $('#heart').classList.add('beat'), 900);
    setTimeout(() => $('#hSub').classList.add('in'), 1900);
    setTimeout(() => $('#toCard').classList.add('in'), 3600);
  };
  cv.onpointerdown = e => { down = true; lp = null; cv.setPointerCapture(e.pointerId); draw(pt(e)); };
  cv.onpointermove = e => { if (down) draw(pt(e)); };
  cv.onpointerup = cv.onpointercancel = () => { down = false; lp = null; };
}
function count(x, cv){
  const d = x.getImageData(0, 0, cv.width, cv.height).data; let c = 0;
  for (let i = 3; i < d.length; i += 64) if (d[i] > 20) c++;
  return c;
}
$('#toCard').addEventListener('click', () => { show('cardScr'); });

// ---------- postcard ----------
let flippedOnce = false;
$('#pc').addEventListener('click', () => {
  $('#pc').classList.toggle('flip');
  if (!flippedOnce) {
    flippedOnce = true;
    $('#pc').classList.remove('nudge'); $('#pc').classList.add('seen');
    $('#pcHint').style.opacity = 0;
    setTimeout(() => { $('#pcHint').style.display = 'none'; $('#end').classList.add('in'); }, 2600);
  }
});
$('#again').addEventListener('click', () => { show('story'); go(0); });

if (location.search.includes('dbg')) window.__dbg = { go: i => { show('story'); go(i); }, flat: () => flat, heart: toHeart, card: () => show('cardScr'), unlock: () => { typed = M.code; unlock(); } };
window.addEventListener('hashchange', () => location.reload());
boot();
})();
